name: HarfBuzz baseline diagnostic
on: workflow_dispatch
permissions:
  contents: read

jobs:
  baseline-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6725459be19bc66e62b6d675c40eefa087af199f
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pristine target sources
        run: |
          test "$(git rev-parse HEAD)" = 6725459be19bc66e62b6d675c40eefa087af199f
          git diff --exit-code -- thirdparty/harfbuzz
          test ! -e modules/jolt_physics/capabilities/cap_skin.cpp
          sha256sum thirdparty/harfbuzz/src/hb-open-type.hh thirdparty/harfbuzz/src/hb-machinery.hh

      - name: Check compilers
        run: |
          if ! command -v g++-11 > /dev/null 2>&1 || ! command -v ld.lld > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes g++-11 lld
          fi
          g++-11 --version
          ld.lld --version

      - uses: rui314/setup-mold@v1
        with:
          mold-version: 3.0.0
          make-default: "false"

      - name: Write minimal array probe
        run: |
          cat > "$RUNNER_TEMP/harfbuzz-probe.cpp" <<'CPP'
          #include "hb-open-type.hh"
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>

          int main(int argc, char **argv) {
            if (argc != 3) {
              return 2;
            }
            const unsigned index = static_cast<unsigned>(std::strtoul(argv[2], nullptr, 10));
            OT::HBUINT32 backing[3];
            for (unsigned i = 0; i < 3; ++i) {
              backing[i] = 17 * (i + 1);
            }
            if (index >= 3) {
              return 2;
            }
            unsigned value;
            if (std::strcmp(argv[1], "direct") == 0) {
              value = backing[index];
            } else if (std::strcmp(argv[1], "harfbuzz") == 0) {
              const auto *array = reinterpret_cast<const OT::UnsizedArrayOf<OT::HBUINT32> *>(backing);
              value = (*array)[index];
            } else {
              return 2;
            }
            std::printf("mode=%s index=%u storage_bytes=%zu value=%u\n", argv[1], index, sizeof(backing), value);
            return value == 17 * (index + 1) ? 0 : 1;
          }
          CPP

      - name: Compare GCC bounds instrumentation and linkers
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=1:color=never
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          source = temp / "harfbuzz-probe.cpp"
          common = ["-std=gnu++17", "-O0", "-g", "-fno-omit-frame-pointer", "-fno-exceptions", "-fsanitize=address,undefined", "-Ithirdparty/harfbuzz/src"]
          results = []
          failures = []
          for strict in (False, True):
              obj = temp / f"probe-{strict}.o"
              flags = ["-fsanitize=bounds-strict"] if strict else []
              command = ["g++-11", *common, *flags, "-c", str(source), "-o", str(obj)]
              print("COMPILE", " ".join(command), flush=True)
              subprocess.run(command, check=True)
              for linker, link_flag in (("mold", "-B/usr/local/libexec/mold"), ("lld", "-fuse-ld=lld")):
                  for gc in (False, True):
                      binary = temp / f"probe-{strict}-{linker}-{gc}"
                      gc_flags = ["-Wl,--gc-sections"] if gc else []
                      command = ["g++-11", str(obj), "-fsanitize=address,undefined", "-static-libgcc", "-static-libstdc++", link_flag, *gc_flags, "-o", str(binary)]
                      print("LINK", " ".join(command), flush=True)
                      subprocess.run(command, check=True)
                      for mode, index in (("direct", 2), ("harfbuzz", 0), ("harfbuzz", 2)):
                          run = subprocess.run([str(binary), mode, str(index)], text=True, capture_output=True)
                          diagnostics = [line for line in run.stderr.splitlines() if "runtime error:" in line]
                          expected = strict and mode == "harfbuzz" and index == 2
                          good = run.returncode == 0 and "ERROR: AddressSanitizer" not in run.stderr
                          # GCC 11 emits two checks for this reference-returning access.
                          good = good and len(diagnostics) == (2 if expected else 0)
                          if expected:
                              good = good and all("hb-open-type.hh:559:" in line and "index 2 out of bounds" in line for line in diagnostics)
                          record = {"bounds_strict": strict, "linker": linker, "gc": gc, "mode": mode, "index": index, "exit": run.returncode, "expected_report": expected, "matched": bool(good), "stdout": run.stdout, "stderr": run.stderr}
                          results.append(record)
                          print(json.dumps(record), flush=True)
                          if not good:
                              failures.append(record)
          (temp / "harfbuzz-probe-report.json").write_text(json.dumps(results, indent=2))
          print(f"Completed {len(results)} observations; {len(failures)} differ from hypothesis.")
          if failures:
              raise SystemExit(1)
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harfbuzz-baseline-probe
          path: |
            ${{ runner.temp }}/harfbuzz-probe.cpp
            ${{ runner.temp }}/harfbuzz-probe-report.json
          retention-days: 7
